
# ADD FONTS
# font_family			JetBrainsMono Nerd Font
# bold_font 			auto
# italic_font			auto
# bold_italic_font		auto
font_size	    		12
	
# Split Layout aktivieren
enabled_layouts splits

# Maps
map ctrl+shift+left previous_window
map ctrl+shift+right next_window

# TEXT CURSOR CUSTOMIZATION
cursor_shape			beam
cursor_beam_thickness		2
cursor_blink_interval		0.5
cursor_stop_blinking_after	0
cursor_trail			1
cursor_trail_delay		0.5 0.5
cursor_trail_start_treshold	2


# Tab bar
tab_bar_edge			bottom
tab_bar_margin_width	0.0
tab_bar_margin_height	0.0 5.0
tab_bar_style			powerline
tab_bar_powerline_tyle  slanted
tab_bar_min_tabs        1
active_tab_font_style	bold
tab_title_template      "{index}:{title}"

# BACKGROUND
background_opacity		0.7
#background_blur 1

# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
