"$schema" = 'https://starship.rs/config-schema.json'

format = """
[ ](red)\
$os\
$username\
[](bg:maroon fg:red)\
$directory\
[](bg:peach fg:maroon)\
$git_branch\
[](bg:yellow fg:peach)\
$git_state\
$git_status\
[](bg:green fg:yellow)\
$package\
[](bg:teal fg:green)\
$python\
$rust\
$typst\
[](bg:sky fg:teal)\
$conda\
$nodejs\
$deno\
[](bg:sapphire fg:sky)\
$docker_context\
$kubernetes\
[](bg:blue fg:sapphire)\
$terraform\
[](bg:lavender fg:blue)\
$time\
[](bg:mauve fg:lavender)\
$battery\
[ ](fg:mauve)\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:red"
format = '[[$symbol](bg:red fg:crust)]($style)'

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[directory]
style = "bg:maroon fg:crust"
read_only = "󰌾"
format = "[ $path $read_only ]($style)"
truncation_length = 2
truncation_symbol = "/"

[directory.substitutions]
"Dokumente" = "󰈙 "
"Downloads" = " "
"Musik" = "󰝚 "
"Bilder" = " "
"Developer" = "󰲋 "

[direnv]
disabled = false
style = "bg:peach fg:crust"
format = '[$symbol$allowed]($style)'

[git_branch]
style = "bg:peach"
always_show_remote = true
symbol = ' '
truncation_symbol = ''
format = '[[ $symbol$branch(:$remote_branch) ](fg:crust bg:peach)]($style)'

[git_commit]
commit_hash_length = 7
style = "bg:peach"
only_detached = false
format = '[[\($hash\)](fg:crust bg:peach)]($style)'

[git_state]
style = "bg:yellow"
format = '[[\( $state($progress_current/$progress_total)\) ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[( $all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[package]
style = "bg:green"
format = '[[ $symbol$version](fg:crust bg:green)]($style)'

[python]
symbol = ' '
style = 'bg:teal'
pyenv_version_name = false
format = '[[ ${symbol}](bg:teal fg:crust)]($style)'

[rust]
symbol = '🦀'
style = 'bg:teal'
detect_extensions = ['rs']
detect_files = ['Cargo.toml']
format = '[[ $symbol($version)](bg:teal fg:crust)]($style)'

[conda]
symbol = ' '
style = 'bg:sky'
format = '[[ $symbol$environment](bg:sky fg:crust)]($style)'
ignore_base = false

[nodejs]
symbol = '󰎙 '
style = 'bg:sky'
format = '[[ $symbol($version )](bg:sky fg:crust)]($style)'
disabled = false

[deno]
style = 'bg:sky'
format = '[[ $symbol($version )](bg:sky fg:crust)]($style)'

[kubernetes]
style =	"bg:sapphire"
symbol = ''
format = '[[$symbol$workspace](bg:sapphire fg:crust]($style)'

[terraform]
style = "bg:blue"
format = '[[$symbol$workspace](bg:blue fg:crust]($style)' 

[time]
style = "bg:lavender"
time_format = '%H:%M'
format = '[[  $time ](bg:lavender fg:crust)]($style)'
disabled = false

[battery]
format = '[[ $symbol$percentage ](bg:mauve fg:crust)]($style)'

[[battery.display]]
threshold = 33
style = 'fg:crust'

[[battery.display]]
threshold = 66
style = 'fg:crust'

[[battery.display]]
threshold = 99
style = 'fg:crust'

[status]
symbol = '✗'
not_found_symbol = ' '
not_executable_symbol = ' '
style = 'bold red'
format = '[\[$status $common_meaning $signal_name $maybe_int\]]($style) '
map_symbol = false
disabled = false

[cmd_duration]
min_time = 500
style = 'bold blue'
format = '[\[$duration\]](${style})'

[character]
success_symbol = '[ ❯](bold green) '
error_symbol = '[ ✗](bold red) '

