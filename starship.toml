# Get editor completions based on the config schema
# "$schema" = 'https://starship.rs/config-schema.json'

# ---------- Define format ---------

format = """
$directory\
$direnv\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$docker_context\
$package\
$python\
$conda\
$rust\
$kubernetes\
$terraform\
$fill\
$time\
$line_break\
$battery\
$cmd_duration\
$status\
$character"""

# ---------- Define modules ----------
[container]
format = '[$symbol \[$name\]]($style '

[kubernetes]
symbol = ' '
format = '[on $symbol ($user on )($cluster in )$context \($namespace\)](dimmed green) '
disabled = false
[package]
format = '[via $symbol$version ]($style)'

[terraform]
symbol = '󱁢 '
format = '[via $symbol$version $workspace]($style) '

# --- Beginn of Git ---
[git_branch]
always_show_remote = true
symbol = ' '
truncation_symbol = ''
format = '[ on $symbol$branch(:$remote_branch)]($style) '
[git_commit]
commit_hash_length = 7
style = 'bold blue'
only_detached = false
format = '[\($hash\)]($style) '

[git_state]
style = 'bold red'
format = '[\($state( $progress_current of $progress_total)\)]($style) '

[git_metrics]
added_style = 'bold blue'
deleted_style = 'bold red'

[git_status]
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
# --- End of Git ---



# --- Beginn of Python ---
[python]
symbol = '  '
style = 'yellow bold'
pyenv_version_name = false
format = '[via ${symbol}${pyenv_prefix}($version ) (\($virtualenv\) )]($style)'

[conda]
symbol = '  '
style = 'bold green'
format = '[via $symbol$environment]($style) '
ignore_base = false
detect_env_vars = ["CONDA_DIR"]
# --- End of Python ---

[rust]
symbol = '🦀 '
style = '#ffa500'
detect_extensions = ['rs']
detect_files = ['Cargo.toml']
format = '[ via $symbol($version )]($style)'


# --- System modules ---
[status]
symbol = '✗'
not_found_symbol = ' '
not_executable_symbol = ' '
style = 'bold red'
format = '[\[$status $common_meaning $signal_name $maybe_int\]]($style) '
map_symbol = false
disabled = false

[os]
disabled = false

[os.symbols]
Fedora = ' '

[time]
style = 'bold white'
format = '[󱑆 $time]($style) '
disabled = false

[character]
success_symbol = '[❯](bold green) '
error_symbol = '[✗](bold red) '

[cmd_duration]
min_time = 500
style = 'bold blue'
format = '[\[$duration\]](${style})'

[fill]
symbol = ' '

[battery]
full_symbol = '🔋 '
charging_symbol = '⚡️ '
empty_symbol = '💀 '
format = '[ $symbol$percentage]($style) '

[[battery.display]]
threshold = 33
style = 'bold red'

[[battery.display]] 
threshold = 66
style = 'bold yellow'

[[battery.display]] 
threshold = 100
style = 'bold green'

[directory]
truncation_length = 4
truncation_symbol = ' /'
read_only = ' 󰌾'
read_only_style = 'red'
home_symbol = ' moritz'

[direnv]
disabled = false
